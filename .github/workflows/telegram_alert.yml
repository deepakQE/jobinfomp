name: Telegram Job Alerts & Scraper

on:
  schedule:
    - cron: '0 * * * *' # Runs at minute 0 of every hour
  workflow_dispatch: # Allows you to manually trigger it from the GitHub UI if needed

jobs:
  broadcast:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        # UPGRADE: Using the stable, official google-generativeai library for AI summarization
        run: pip install supabase requests python-dotenv beautifulsoup4 google-genai pypdf
      - name: Run Scraper & Telegram Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }} # MUST BE SERVICE ROLE KEY
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }} # Required for AI features
        run: python telegram_bot.py